# Lane TLS overlay for docker-compose.yml, container mode (PIM#86, RealityEngine_CI#668).
#
#   eval "$(scripts/lane-tls-certs.sh)"
#   docker compose -f docker-compose.yml -f docker-compose.tls.yml up -d
#
# Every link is TLS 1.3 under the transport profile:
#   - css serves https itself (config/css-https.json), as assets-css does. It
#     does not verify client certificates: an owner-accepted deficiency
#     (2026-11-09), compensated by Solid-OIDC with DPoP-bound tokens.
#   - pim serves https only (RE_TLS_CERT), server TLS (a user-facing port), and
#     its calls to css trust the install CA alone and present pim's certificate
#     (src/laneTls.ts). Plaintext internal URLs are refused at startup.

services:
  css:
    command:
      - "-c"
      - "/config/css-https.json"
      - "-f"
      - "/data"
      - "-p"
      - "${CSS_PORT:-13000}"
      - "-b"
      - "https://css.localhost:${CSS_PORT:-13000}/"
      - "--httpsKey"
      - "/pki/self/key.pem"
      - "--httpsCert"
      - "/pki/self/chain.pem"
    environment:
      NODE_OPTIONS: "--tls-min-v1.3 --tls-cipher-list=TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256"
      NODE_EXTRA_CA_CERTS: /pki/ca.crt
    volumes:
      - ./config/css-https.json:/config/css-https.json:ro
      - ${PIM_TLS_DIR:?eval scripts/lane-tls-certs.sh first}/css:/pki/self:ro
      - ${PIM_TLS_DIR:?eval scripts/lane-tls-certs.sh first}/ca.crt:/pki/ca.crt:ro
    healthcheck:
      test: ["CMD", "node", "-e", "require('https').get({host:'127.0.0.1',port:${CSS_PORT:-13000},path:'/',servername:'css.localhost',minVersion:'TLSv1.3',ca:require('fs').readFileSync('/pki/ca.crt')},r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]

  bootstrap:
    environment:
      CSS_BASE_URL: "https://css.localhost:${CSS_PORT:-13000}/"
      NODE_EXTRA_CA_CERTS: /pki/ca.crt
      NODE_OPTIONS: "--tls-min-v1.3"
    volumes:
      - ${PIM_TLS_DIR:?eval scripts/lane-tls-certs.sh first}/ca.crt:/pki/ca.crt:ro

  pim:
    environment:
      SOLID_POD_SERVER_URL: "https://css.localhost:${CSS_PORT:-13000}"
      SOLID_OIDC_ISSUER: "https://css.localhost:${CSS_PORT:-13000}"
      SOLID_POD_BASE_URL: "https://css.localhost:${CSS_PORT:-13000}/${CSS_POD_NAME:-alice}/"
      SOLID_REDIRECT_URL: "https://localhost:${APP_PORT:-8080}/callback"
      EPIC_REDIRECT_URI: "${EPIC_REDIRECT_URI:-https://localhost:${APP_PORT:-8080}/api/integrations/epic/connect/callback}"
      RE_TLS_CERT: /pki/self/chain.pem
      RE_TLS_KEY: /pki/self/key.pem
      RE_TLS_CA: /pki/ca.crt
      RE_TLS_CRL: /pki/ca.crl
    volumes:
      - ${PIM_TLS_DIR:?eval scripts/lane-tls-certs.sh first}/pim:/pki/self:ro
      - ${PIM_TLS_DIR:?eval scripts/lane-tls-certs.sh first}/ca.crt:/pki/ca.crt:ro
      - ${PIM_TLS_DIR:?eval scripts/lane-tls-certs.sh first}/ca.crl:/pki/ca.crl:ro
    healthcheck:
      test: ["CMD", "node", "-e", "require('https').get({host:'127.0.0.1',port:${APP_PORT:-8080},path:'/livez',servername:'localhost',minVersion:'TLSv1.3',ca:require('fs').readFileSync('/pki/ca.crt')},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
